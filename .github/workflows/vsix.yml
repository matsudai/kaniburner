name: Package and Release VSIX

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    if: ${{ !startsWith(github.event.release.tag_name, 'mruby-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not match the expected format '<x.y.z>' or '<x.y.z>-<n>' (no 'v' prefix)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vsix/package-lock.json

      - name: Fetch default mruby WASM assets from GitHub Release
        run: make -C vsix fetch-wasm

      - name: Install npm dependencies
        run: npm ci
        working-directory: vsix

      - name: Package .vsix
        run: npx --yes @vscode/vsce package --allow-missing-repository
        working-directory: vsix

      - name: Upload .vsix to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" vsix/*.vsix --repo "${{ github.repository }}" --clobber
